name: Aggiorna dati cantieri

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Scarica dati da MIT e ANAC
        run: python scripts/fetch_cantieri.py

      - name: Commit e push dati aggiornati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sincronizza con lo stato attuale del remoto PRIMA di committare
          git fetch origin main
          git reset --soft origin/main
          git add data/cantieri.json data/manifest.json
          # Esci senza errore se non ci sono modifiche
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dati, skip commit."
            exit 0
          fi
          git commit -m "chore: aggiorna dati cantieri $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
