name: Aggiorna dati cantieri

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Scarica dati da MIT e ANAC
        run: python scripts/fetch_cantieri.py

      - name: Commit e push dati aggiornati
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cantieri.json data/manifest.json
          git diff --staged --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "chore: aggiorna dati cantieri $(date -u +'%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push origin main
